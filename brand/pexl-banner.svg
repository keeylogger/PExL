      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="180" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ec9b0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="380" y1="190" x2="900" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ec9b0"/>
      <stop offset="1" stop-color="#569cd6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- icon tile -->
