  <text x="640" y="392" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" fill="#e6edf3">Plain Excel Language</text>

  <text x="640" y="452" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="26" fill="#8b98a9">take this  &#8594;  do that  &#8594;  put it there</text>
