name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore PExL.sln

      - name: Build
        run: dotnet build PExL.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/PExL.Core.Tests/PExL.Core.Tests.csproj -c Release --no-build --verbosity normal
